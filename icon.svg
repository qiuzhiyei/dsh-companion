<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- DSH 伴侣图标：深色圆角底 + 浅色宠物 + 右上角状态呼吸点（状态监测的隐喻）。原创绘制。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d4d68"/>
      <stop offset="1" stop-color="#1c2433"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dce7f2"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <!-- 宠物身体（水滴形团子） -->
  <path d="M31 15c-9.6 0-17.4 7.2-17.4 16 0 5.5 3 10.4 7.6 13.3l-1.5 5.5c-.4 1.3 1 2.4 2.2 1.8l6.6-3.4c.8.1 1.7.2 2.5.2 9.6 0 17.4-7.2 17.4-16S40.6 15 31 15z" fill="url(#body)"/>
  <!-- 眼睛 -->
  <circle cx="24.5" cy="30.5" r="2.7" fill="#1c2433"/>
  <circle cx="37.5" cy="30.5" r="2.7" fill="#1c2433"/>
  <circle cx="25.4" cy="29.6" r=".9" fill="#ffffff"/>
  <circle cx="38.4" cy="29.6" r=".9" fill="#ffffff"/>
  <!-- 微笑 -->
  <path d="M26 37.5q5 4.2 10 0" stroke="#1c2433" stroke-width="2.1" fill="none" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="19.8" cy="35" rx="2.4" ry="1.5" fill="#f2b8ae" opacity=".8"/>
  <ellipse cx="42.2" cy="35" rx="2.4" ry="1.5" fill="#f2b8ae" opacity=".8"/>
  <!-- 状态点：在线/监测中 -->
  <circle cx="48.5" cy="15.5" r="6.5" fill="#1c2433"/>
  <circle cx="48.5" cy="15.5" r="4.6" fill="#3ddc84"/>
</svg>
